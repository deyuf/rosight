<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rosight logo">
  <title>Rosight</title>
  <!-- ROS + sight: a reticle locked onto one node of a small ROS graph.
       Flat solid colours only. favicon.svg is a simplified variant. -->
  <rect width="256" height="256" rx="56" fill="#0F172A"/>
  <g stroke="#475569" stroke-width="10" stroke-linecap="round">
    <line x1="132" y1="124" x2="196" y2="72"/>
    <line x1="124" y1="132" x2="74" y2="190"/>
  </g>
  <circle cx="196" cy="72" r="15" fill="#F8FAFC"/>
  <circle cx="74" cy="190" r="15" fill="#F8FAFC"/>
  <circle cx="128" cy="128" r="46" fill="#0F172A" stroke="#38BDF8" stroke-width="12"/>
  <g stroke="#38BDF8" stroke-width="12" stroke-linecap="round">
    <line x1="128" y1="58" x2="128" y2="76"/>
    <line x1="128" y1="180" x2="128" y2="198"/>
    <line x1="58" y1="128" x2="76" y2="128"/>
    <line x1="180" y1="128" x2="198" y2="128"/>
  </g>
  <circle cx="128" cy="128" r="18" fill="#F59E0B"/>
</svg>
